<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VED PHARMACY</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#17202a}header{background:#1769aa;color:#fff;padding:16px}nav{display:flex;gap:5px;overflow:auto;background:#fff;padding:8px;position:sticky;top:0}nav button{padding:10px;border:0;border-radius:8px}nav .on{background:#1769aa;color:#fff}main{max-width:760px;margin:auto;padding:12px}.page{display:none}.page.on{display:block}.card{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 5px #0001}input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccd5df;border-radius:8px;box-sizing:border-box}.row{display:flex;gap:6px}.row>*{flex:1}button.primary{background:#1769aa;color:#fff;border:0;padding:11px;border-radius:8px}.item{padding:10px 0;border-bottom:1px solid #eee}.right{float:right}.small{font-size:12px;color:#667}.edit{background:#e8f1f8;border:0;padding:7px;border-radius:7px}.del{background:#fdeaea;border:0;padding:7px;border-radius:7px;color:#a00}.stat{font-size:20px;font-weight:bold}
</style></head>
<body>
<header><b>💊 VED PHARMACY</b><div>Inventory • Purchase • Billing</div></header>
<nav><button class="on" onclick="go('home',this)">Home</button><button onclick="go('purchase',this)">Purchase</button><button onclick="go('stock',this)">Stock</button><button onclick="go('bill',this)">Bill</button><button onclick="go('sales',this)">Sales</button></nav>
<main>
<section id="home" class="page on"><div class="card"><div class="stat" id="sv">₹0</div><div class="small">Stock value</div><hr><div class="stat" id="lc">0</div><div class="small">Low stock items</div></div></section>
<section id="purchase" class="page"><div class="card"><h3 id="pt">Purchase Entry</h3>
<input id="pn" placeholder="Medicine name"><input id="pc" placeholder="Company"><div class="row"><input id="pb" placeholder="Batch"><input id="pe" type="month"></div>
<div class="row"><input id="pr" type="number" placeholder="Purchase rate"><input id="pm" type="number" placeholder="MRP"></div>
<div class="row"><input id="pq" type="number" placeholder="Quantity"><input id="pmin" type="number" placeholder="Minimum stock"></div>
<input id="ps" placeholder="Supplier"><input id="pi" placeholder="Invoice No.">
<button class="primary" id="pbtn" onclick="savePurchase()">ADD PURCHASE</button>
<button class="primary" id="cancel" style="display:none" onclick="cancelEdit()">CANCEL EDIT</button></div>
<div class="card"><h3>Purchase History</h3><input id="psearch" placeholder="Search..." oninput="purchaseView()"><div id="plist"></div></div></section>
<section id="stock" class="page"><div class="card"><h3>Inventory</h3><input id="sq" placeholder="Search medicine" oninput="stockView()"><div id="stock"></div></div></section>
<section id="bill" class="page"><div class="card"><h3>Billing</h3><p>Billing module ready for medicines saved in inventory.</p><div id="billstock"></div></div></section>
<section id="sales" class="page"><div class="card"><h3>Sales</h3><div id="saleslist"></div></div></section>
</main>
<script>
const KEY='VED_PHARMACY_EDIT_V1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"batches":[],"purchases":[],"sales":[]}'),editId=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db));refresh();}
function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');if(id==='purchase')purchaseView();if(id==='stock')stockView();}
function data(){return{name:$('pn').value.trim(),company:$('pc').value,batch:$('pb').value,expiry:$('pe').value,purchase:+$('pr').value||0,mrp:+$('pm').value||0,qty:+$('pq').value||0,min:+$('pmin').value||5,supplier:$('ps').value,invoice:$('pi').value};}
function clearForm(){['pn','pc','pb','pe','pr','pm','pq','pmin','ps','pi'].forEach(id=>$(id).value='');}
function savePurchase(){
 let v=data(); if(!v.name)return alert('Medicine name required');
 if(editId){
  let p=db.purchases.find(x=>x.id===editId),b=db.batches.find(x=>x.id===p.batchId);
  if(!p||!b)return alert('Record not found');
  b.qty-=p.qty; Object.assign(b,v); b.qty+=v.qty;
  Object.assign(p,{name:v.name,qty:v.qty,total:v.purchase*v.qty,supplier:v.supplier,invoice:v.invoice});
  editId=null;$('pbtn').textContent='ADD PURCHASE';$('cancel').style.display='none';alert('Purchase updated');
 }else{
  let id=Date.now();db.batches.push({id,...v});db.purchases.push({id,name:v.name,qty:v.qty,total:v.purchase*v.qty,supplier:v.supplier,invoice:v.invoice,batchId:id,date:new Date().toISOString()});alert('Purchase saved');
 }
 clearForm();save();purchaseView();
}
function editPurchase(id){
 let p=db.purchases.find(x=>x.id===id),b=db.batches.find(x=>x.id===p.batchId);if(!b)return;
 editId=id;let m={pn:b.name,pc:b.company,pb:b.batch,pe:b.expiry,pr:b.purchase,pm:b.mrp,pq:b.qty,pmin:b.min,ps:b.supplier,pi:b.invoice};
 Object.keys(m).forEach(k=>$(k).value=m[k]);$('pbtn').textContent='UPDATE PURCHASE';$('cancel').style.display='block';window.scrollTo(0,0);
}
function cancelEdit(){editId=null;clearForm();$('pbtn').textContent='ADD PURCHASE';$('cancel').style.display='none';}
function deletePurchase(id){
 let p=db.purchases.find(x=>x.id===id),b=db.batches.find(x=>x.id===p.batchId);
 if(!confirm('Delete this purchase and remove its quantity from stock?'))return;
 if(b)b.qty=Math.max(0,b.qty-p.qty);db.purchases=db.purchases.filter(x=>x.id!==id);save();purchaseView();
}
function purchaseView(){
 let q=($('psearch').value||'').toLowerCase(),a=db.purchases.slice().reverse().filter(p=>(p.name+' '+p.supplier+' '+p.invoice).toLowerCase().includes(q));
 $('plist').innerHTML=a.length?a.map(p=>`<div class="item"><b>${p.name}</b><span class="right">₹${p.total}</span><br><span class="small">${p.qty} units • ${p.supplier||'-'} • Invoice ${p.invoice||'-'}</span><br><button class="edit" onclick="editPurchase(${p.id})">✏️ Edit</button> <button class="del" onclick="deletePurchase(${p.id})">🗑️ Delete</button></div>`).join(''):'<div class="item">No purchases yet</div>';
}
function stockView(){
 let q=($('sq').value||'').toLowerCase(),a=db.batches.filter(b=>(b.name+' '+b.company+' '+b.batch).toLowerCase().includes(q));
 $('stock').innerHTML=a.map(b=>`<div class="item"><b>${b.name}</b><span class="right">Stock ${b.qty}</span><br><span class="small">${b.company} • Batch ${b.batch||'-'} • Exp ${b.expiry||'-'} • MRP ₹${b.mrp}</span></div>`).join('')||'<div class="item">No stock</div>';
}
function refresh(){ $('sv').textContent='₹'+db.batches.reduce((a,b)=>a+b.purchase*b.qty,0);$('lc').textContent=db.batches.filter(b=>b.qty<=b.min).length; }
refresh();purchaseView();
</script></body></html>
